services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: file:../data/chain.db
      MEDIA_DIR: /app/storage
      MAX_MEDIA_BYTES: '536870912'
    volumes:
      - chain_data:/app/data
      - chain_files:/app/storage
    expose:
      - '3000'

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env.deploy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  chain_data:
  chain_files:
  caddy_data:
  caddy_config:
